name: One-Time Fill Issue Number

on:
  workflow_dispatch: # Запуск вручную одной кнопкой

jobs:
  fill-issue-number:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Items and Fill Issue Number Field
        uses: actions/github-script@v8
        with:
          # PAT (classic) со scope `project` или fine-grained с `Projects: Read and write`.
          # Дефолтный GITHUB_TOKEN с ProjectV2 не работает.
          github-token: ${{ secrets.PROJECT_SYNC_TOKEN }}
          script: |
            // === НАСТРОЙКИ ===
            const PROJECT_NUMBER = 2; // ⚠️ ПОДСТАВЬТЕ НОМЕР ПРОЕКТА ИЗ URL
            const TARGET_FIELD_NAME = "Issue Number"; // ⚠️ Имя поля в проекте
            const REPO_FILTER = null; // null = все репозитории; "owner/repo" = только один

            const owner = context.repo.owner;

            console.log(`Запуск сканирования проекта №${PROJECT_NUMBER}...`);

            // === 1. Получаем ID проекта и ID поля ===
            // repositoryOwner работает и для user, и для org.
            const metaQuery = `
              query($owner: String!, $number: Int!) {
                repositoryOwner(login: $owner) {
                  ... on ProjectV2Owner {
                    projectV2(number: $number) {
                      id
                      fields(first: 50) {
                        nodes { ... on ProjectV2FieldCommon { id name } }
                      }
                    }
                  }
                }
              }
            `;
            const metaRes = await github.graphql(metaQuery, { owner, number: PROJECT_NUMBER });
            const projectNode = metaRes.repositoryOwner?.projectV2;
            if (!projectNode) throw new Error("Проект не найден! Проверьте номер проекта.");

            const projectId = projectNode.id;
            const numberField = projectNode.fields.nodes.find(f => f.name === TARGET_FIELD_NAME);
            if (!numberField) throw new Error(`Поле '${TARGET_FIELD_NAME}' не найдено в проекте!`);

            console.log(`Найдено поле '${TARGET_FIELD_NAME}' (id=${numberField.id}).`);

            // === 2. Постранично получаем все items проекта ===
            const itemsQuery = `
              query($projectId: ID!, $cursor: String) {
                node(id: $projectId) {
                  ... on ProjectV2 {
                    items(first: 100, after: $cursor) {
                      pageInfo { hasNextPage endCursor }
                      nodes {
                        id
                        content {
                          __typename
                          ... on Issue { number repository { nameWithOwner } }
                        }
                      }
                    }
                  }
                }
              }
            `;

            // Мутация для записи числа в поле типа Number
            const updateMutation = `
              mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $numberValue: Float!) {
                updateProjectV2ItemFieldValue(input: {
                  projectId: $projectId,
                  itemId: $itemId,
                  fieldId: $fieldId,
                  value: { number: $numberValue }
                }) {
                  projectV2Item { id }
                }
              }
            `;

            let cursor = null;
            let processed = 0;
            let skipped = 0;

            do {
              const res = await github.graphql(itemsQuery, { projectId, cursor });
              const page = res.node.items;
              cursor = page.pageInfo.hasNextPage ? page.pageInfo.endCursor : null;

              for (const item of page.nodes) {
                const c = item.content;

                // Пропускаем всё, что не Issue (PR, DraftIssue, null)
                if (!c || c.__typename !== "Issue") {
                  skipped++;
                  continue;
                }

                // Фильтр по репозиторию (если задан)
                if (REPO_FILTER && c.repository?.nameWithOwner !== REPO_FILTER) {
                  skipped++;
                  continue;
                }

                const issueNumber = c.number;
                if (issueNumber == null) {
                  skipped++;
                  continue;
                }

                // Записываем номер issue в поле
                await github.graphql(updateMutation, {
                  projectId,
                  itemId: item.id,
                  fieldId: numberField.id,
                  numberValue: issueNumber // Float! принимает целое
                });

                console.log(`✅ #${issueNumber} → "${TARGET_FIELD_NAME}" = ${issueNumber}`);
                processed++;

                // Задержка, чтобы уложиться в лимиты API
                await new Promise(r => setTimeout(r, 200));
              }
            } while (cursor);

            console.log(`🎉 Готово. Обновлено: ${processed}, пропущено: ${skipped}.`);
