name: Auto Sync Created Date to Project

on:
  issues:
    types: [opened, reopened] # Срабатывает автоматически при создании/переоткрытии задачи

jobs:
  sync-created-date:
    runs-on: ubuntu-latest
    steps:
      - name: Get Issue Created Date and Update Project Field
        uses: actions/github-script@v8
        with:
          # PAT (classic) со scope `project` или fine-grained с `Projects: Read and write`.
          # Дефолтный GITHUB_TOKEN с ProjectV2 не работает.
          github-token: ${{ secrets.PROJECT_SYNC_TOKEN }}
          script: |
            // === НАСТРОЙКИ ===
            const TARGET_FIELD_NAME = "Original Date";
            const PROJECT_NUMBER = 2; // ⚠️ ПОДСТАВЬТЕ НОМЕР ПРОЕКТА ИЗ URL

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issueNodeId = context.payload.issue.node_id;
            const title = context.payload.issue.title;
            const number = context.payload.issue.number;
            const fullName = `${owner}/${repo}`;

            // Системная дата создания (обрезаем до YYYY-MM-DD)
            const isoDate = context.payload.issue.created_at.substring(0, 10);
            console.log(`Обработка задачи #${number} "${title}". Дата создания: ${isoDate}`);

            // === 1. Получаем ID проекта и ID поля через GraphQL ===
            // repositoryOwner работает и для user, и для org (в отличие от user/organization).
            const metaQuery = `
              query($owner: String!, $number: Int!) {
                repositoryOwner(login: $owner) {
                  ... on ProjectV2Owner {
                    projectV2(number: $number) {
                      id
                      fields(first: 50) {
                        nodes { ... on ProjectV2FieldCommon { id name } }
                      }
                    }
                  }
                }
              }
            `;
            const metaRes = await github.graphql(metaQuery, { owner, number: PROJECT_NUMBER });
            const projectNode = metaRes.repositoryOwner?.projectV2;
            if (!projectNode) throw new Error("Проект не найден! Проверьте номер проекта.");

            const projectId = projectNode.id;
            const dateField = projectNode.fields.nodes.find(f => f.name === TARGET_FIELD_NAME);
            if (!dateField) throw new Error(`Поле '${TARGET_FIELD_NAME}' не найдено в проекте!`);

            // === 2. Добавляем issue в проект (или находим существующий itemId) ===
            const addProjectItemMutation = `
              mutation($projectId: ID!, $contentId: ID!) {
                addProjectV2ItemById(input: { projectId: $projectId, contentId: $contentId }) {
                  item { id }
                }
              }
            `;

            let itemId = null;

            // Пытаемся добавить issue в проект.
            // Если Auto-add в проекте уже сработал — мутация упадёт с "already added",
            // это ожидаемо, продолжаем поиск itemId через пагинацию.
            try {
              const addRes = await github.graphql(addProjectItemMutation, { projectId, contentId: issueNodeId });
              itemId = addRes.addProjectV2ItemById.item.id;
              console.log(`Issue #${number} добавлена в проект.`);
            } catch (e) {
              if (!/already added/i.test(e.message)) throw e;
              console.log(`Issue #${number} уже в проекте — ищем itemId...`);
            }

            // Если itemId ещё не известен (issue уже была в проекте) — ищем через пагинацию.
            if (!itemId) {
              const findItemQuery = `
                query($projectId: ID!, $cursor: String) {
                  node(id: $projectId) {
                    ... on ProjectV2 {
                      items(first: 100, after: $cursor) {
                        pageInfo { hasNextPage endCursor }
                        nodes {
                          id
                          content {
                            ... on Issue { number repository { nameWithOwner } }
                          }
                        }
                      }
                    }
                  }
                }
              `;

              let cursor = null;
              do {
                const res = await github.graphql(findItemQuery, { projectId, cursor });
                const page = res.node.items;
                for (const it of page.nodes) {
                  if (it.content?.number === number && it.content?.repository?.nameWithOwner === fullName) {
                    itemId = it.id;
                    break;
                  }
                }
                cursor = page.pageInfo.hasNextPage ? page.pageInfo.endCursor : null;
              } while (!itemId && cursor);
            }

            if (!itemId) throw new Error(`Не удалось найти item проекта для issue #${number}`);

            // === 3. Записываем дату в кастомное поле проекта ===
            const updateMutation = `
              mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $dateValue: Date!) {
                updateProjectV2ItemFieldValue(input: {
                  projectId: $projectId,
                  itemId: $itemId,
                  fieldId: $fieldId,
                  value: { date: $dateValue }
                }) {
                  projectV2Item { id }
                }
              }
            `;
            await github.graphql(updateMutation, {
              projectId,
              itemId,
              fieldId: dateField.id,
              dateValue: isoDate
            });

            console.log(`🎉 Дата успешно синхронизирована для #${number}!`);
